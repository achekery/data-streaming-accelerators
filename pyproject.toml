[project]
name = "data-streaming-accelerators"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "sortedcontainers>=2.4.0",
]

[project.optional-dependencies]
benchmark = [
    "matplotlib>=3.10.9",
    "pandas>=3.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
docs = [
    "mkdocs-macros-plugin>=1.5.0",
    "mkdocs-material>=9.7.6",
    "mkdocstrings-python>=2.0.3",
    "mkdocstrings[python]>=1.0.4",
    "pymdown-extensions>=11.0",
]
lint = [
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_streaming_accelerators"]

[tool.pytest.ini_options]
markers = [
    "func: marks tests as functional tests",
    "perf: marks tests as performance tests",
]
