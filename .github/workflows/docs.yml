name: docs
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Setup Python
        run: uv python install 3.13
      - name: Build and Deploy
        run: |
          uv sync --group docs
          uv run mkdocs gh-deploy --force
